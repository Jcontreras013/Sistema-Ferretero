databases:
  - name: sistema-ferretero-db
    databaseName: sistema_ferretero
    user: sistema_ferretero
    plan: free
    region: oregon

services:
  - type: web
    name: sistema-ferretero
    env: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-ferretero-db
          property: connectionString
      # Opcional: crea el superusuario inicial en el primer deploy.
      # Define los valores en el dashboard de Render (no viajan en este archivo).
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
